name: Build better app
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/build-better.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: better-source-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.11.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsc --noEmit
      - run: node --experimental-strip-types --test tests/*.test.ts
      - run: pnpm exec expo export --platform web --output-dir web-export
        env:
          EXPO_NO_TELEMETRY: '1'
          BETTER_WEB_BASE_PATH: /better
      - run: node scripts/prepare-ci-pages.mjs
      - name: Commit validated app assets
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build validated better app assets'
          git push origin HEAD:main

